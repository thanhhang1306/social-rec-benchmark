[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["RecBole-GNN", "env", "results", "datasets", "figures", "exploration", "logs", "log_tensorboard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["thesis_palette"]
